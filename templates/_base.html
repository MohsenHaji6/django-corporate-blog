{% load static %}

<!doctype html>
<html lang="en" dir="ltl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{% block title %} {% endblock title %} | YadakOtol</title>
        <meta
            name="description"
            content="{{ meta_description|default:'YadakOtol - Car spare parts' }}"
        />
        <link rel="stylesheet" href="{% static 'css/output.css' %}" />
        {% block extra_head %} {% endblock %}
    </head>
    <body class="bg-slate-50 text-slate-800 min-h-screen">
        <main class="p-5 pt-3 pb-3">
            <header>{% include 'header.html' %}</header>

            <!--Main Content-->
            <div class="mt-27">{% block content %} {% endblock content %}</div>

            <footer>{% include 'footer.html' %}</footer>
        </main>
        {% block extra_js %}{% endblock %}
    </body>
</html>
