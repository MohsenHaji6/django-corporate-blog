{% load static %}

<!doctype html>
<html lang="en" dir="ltl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="{{ setting.favicon.url }}" data-next-head />
        <title>{% block title %}{{setting.site_title}}{% endblock title %}</title>
        <meta
            name="description"
            content="{% block meta_description %}{{setting.site_description}}{% endblock %}"
        />
        <link rel="stylesheet" href="{% static 'css/output.css' %}" />
        {% block extra_head %} {% endblock %}
    </head>
    <body class="bg-slate-50 text-slate-800 min-h-screen">
        <main class="p-5 pt-3 pb-3">
            <header>{% include 'components/header.html' %}</header>

            <!--Main Content-->
            <div class="mt-27">{% block content %} {% endblock content %}</div>

            <footer>{% include 'components/footer.html' %}</footer>
        </main>
        {% block extra_js %}{% endblock %}
    </body>
</html>
