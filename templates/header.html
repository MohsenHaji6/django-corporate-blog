{% load media_placeholder %} {% load static %}
<div id="header" class="fixed z-50 left-0 right-0 transition-all duration-400">
    <div class="mx-5">
        <div
            class="grid grid-cols-5 justify-items-stretch h-22 px-5 shadow shadow-slate-300 rounded-2xl bg-white transition-all duration-400"
            id="container"
        >
            <nav class="flex justify-start items-center col-span-2 gap-10">
                <a
                    href="{% url 'core:home' %}"
                    class="font-semibold p-2 hover:underline {% if request.resolver_match.view_name == 'core:home' %} scale-110 underline {% endif %}"
                    >Home</a
                >
                <a
                    href="{% url 'blog:list' %}"
                    class="font-semibold p-2 hover:underline {% if request.resolver_match.namespace == 'blog' %} scale-110 underline {% endif %}"
                    >Blog</a
                >
                <a
                    href="{% url 'core:about' %}"
                    class="font-semibold p-2 hover:underline {% if request.resolver_match.view_name == 'core:about' %} scale-110 underline {% endif %}"
                    >About</a
                >
                <a
                    href="{% url 'core:contact' %}"
                    class="font-semibold p-2 hover:underline {% if request.resolver_match.view_name == 'core:contact' %} scale-110 underline {% endif %}"
                    >Contact</a
                >
            </nav>
            <div class="grid justify-center items-center">
                <img
                    src="/media/logo/yadakotol.png "
                    alt=""
                    id="logo"
                    width="200px"
                    class="transition-all duration-600"
                />
            </div>
            <div class="flex justify-end col-span-2 items-center gap-5">
                <div class="w-full px-5">
                    <form
                        action="{% url 'core:search' %}"
                        method="get"
                        id="search"
                        class="w-full max-w-md"
                    >
                        <div
                            class="group relative flex items-center rounded-sm border border-slate-200 bg-white shadow-sm transition-all duration-300 focus-within:bg-slate-50"
                        >
                            <input
                                type="search"
                                name="q"
                                placeholder="Search in blogs..."
                                class="h-11 w-full rounded-xl bg-transparent px-3 text-m text-slate-700 placeholder:text-slate-400 focus:outline-none"
                            />

                            <button
                                type="submit"
                                class="absolute right-2 flex h-8 w-8 items-center justify-center rounded-lg text-slate-500 transition-all duration-300 hover:bg-blue-600 hover:text-white active:scale-95"
                                aria-label="Search"
                            >
                                <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    fill="none"
                                    viewBox="0 0 24 24"
                                    stroke-width="2"
                                    stroke="currentColor"
                                    class="size-5 transition-transform duration-300 group-focus-within:scale-110"
                                >
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        d="m21 21-4.35-4.35m1.85-5.15a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"
                                    />
                                </svg>
                            </button>
                        </div>
                    </form>
                </div>
                <a
                    href="{% url 'price_list' %}"
                    class="flex flex-row w-2/6 h-11 justify-center text-white py-2 rounded-sm bg-blue-500 hover:bg-blue-600"
                    >Price List</a
                >
            </div>
        </div>
    </div>
</div>
<script src="{% static 'js/sticky_header.js' %}"></script>
