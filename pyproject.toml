[project]
name = "blog"
version = "0.1.0"
description = "store-site"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.6",
    "django-tinymce>=5.0.0",
    "django-treebeard>=5.2.2",
    "environs>=15.0.1",
    "pillow>=12.2.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=7.0.0",
    "faker>=40.31.0",
    "ruff>=0.15.17",
]

[tool.ruff]
line-length = 91
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
