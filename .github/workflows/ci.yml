name: CI

on:
    push:
        branches:
            - master

jobs:
    test:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:18
                env:
                    POSTGRES_DB: ci_db
                    POSTGRES_USER: ci_user
                    POSTGRES_PASSWORD: ci_password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: '3.13'

            - name: Install uv
              run: pip install uv

            - name: Install dependencies
              run: uv sync --frozen

            - name: Run migrations
              env:
                  DJANGO_SECRET_KEY: ci-secret-key
                  DJANGO_ALLOWED_HOSTS: localhost
                  POSTGRES_DB: ci_db
                  POSTGRES_USER: ci_user
                  POSTGRES_PASSWORD: ci_password
                  POSTGRES_HOST: localhost
                  POSTGRES_PORT: 5432
              run: uv run python manage.py migrate

            - name: Run tests
              env:
                  DJANGO_SECRET_KEY: ci-secret-key
                  DJANGO_ALLOWED_HOSTS: localhost
                  POSTGRES_DB: ci_db
                  POSTGRES_USER: ci_user
                  POSTGRES_PASSWORD: ci_password
                  POSTGRES_HOST: localhost
                  POSTGRES_PORT: 5432
              run: uv run python manage.py test
